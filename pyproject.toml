[project]
name = "deep-research"
version = "0.2.0"
description = "Evidence Deep Research：可溯源的多路并行技术选型研究系统（LangGraph + MCP + RAG）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "mcp>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.4",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "knowledge_base", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"
