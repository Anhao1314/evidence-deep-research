name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests (offline, no API key needed)
        run: pytest -q

      - name: Eval suite
        run: python -m eval.run_eval --output eval-report.json

      - name: Offline research task suite (structural, no API key)
        run: python -m eval.run_offline_suite --output offline-suite-report.json

      - name: Constraint fixture suite (offline, synthetic)
        run: python -m eval.run_constraint_fixture --output constraint-fixture-report.json

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            eval-report.json
            offline-suite-report.json
            constraint-fixture-report.json
